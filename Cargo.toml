[workspace]
members = [
    "contracts/eco-token",
    "contracts/ecotask-types",
    "contracts/task-registry",
    "contracts/reward-engine",
]
resolver = "2"

[package]
name = "ecotask-contracts"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
eco-token = { path = "contracts/eco-token" }
task-registry = { path = "contracts/task-registry" }
reward-engine = { path = "contracts/reward-engine" }
soroban-sdk = { version = "26.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
